# TASK-012 일회성 확인용: GitHub 러너에서 국가 표준노드링크 다운로드 주소에 접근되는지만 확인한다(내용 저장 없음). 확인 후 삭제.
name: nodelink-probe
on:
  push:
    branches: [claude/adoring-sagan-harjwg]
    paths: [.github/workflows/nodelink-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 다운로드 주소 응답 확인
        run: |
          URL="https://www.its.go.kr/opendata/nodelinkFileSDownload/DF_221/0"
          curl -sS -L -o /tmp/nl.bin -D /tmp/h.txt --max-time 300 -w 'http=%{http_code} size=%{size_download} type=%{content_type} time=%{time_total}\n' "$URL" || echo "curl failed: $?"
          grep -iE '^(HTTP|content-type|content-length|content-disposition|location)' /tmp/h.txt || true
          ls -l /tmp/nl.bin || true
          file /tmp/nl.bin || true
          if unzip -l /tmp/nl.bin > /tmp/list.txt 2>/dev/null; then cat /tmp/list.txt; fi
